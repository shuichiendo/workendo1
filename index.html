<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>workendo | 暮らしの雑貨店</title>
  <meta name="description" content="毎日をちょっと素敵にする暮らしの雑貨をお届けするセレクトショップ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #faf7f2;
      --card: #ffffff;
      --ink: #3a3733;
      --muted: #8a8378;
      --line: #ece6dc;
      --accent: #b08968;
      --accent-dark: #8a6a4f;
      --price: #6b4f3a;
      --sale: #c0654e;
      --shadow: 0 6px 24px rgba(120, 100, 80, 0.10);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.75;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    h1, h2, h3 { font-weight: 500; line-height: 1.3; }
    .serif { font-family: 'Cormorant Garamond', serif; }
    .container { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

    /* ===== Header ===== */
    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(250, 247, 242, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      height: 66px;
    }
    .logo { font-size: 1.5rem; letter-spacing: 0.08em; font-weight: 600; }
    .logo span { color: var(--accent); }
    .cart-btn {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 999px;
      background: var(--ink); color: #fff; font-size: 0.85rem;
      transition: transform .15s ease, background .2s ease;
    }
    .cart-btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .cart-count {
      min-width: 20px; height: 20px; padding: 0 5px;
      background: var(--accent); border-radius: 999px;
      font-size: 0.72rem; display: grid; place-items: center; font-weight: 500;
    }

    /* ===== Hero ===== */
    .hero {
      padding: 72px 0 60px;
      text-align: center;
      background:
        radial-gradient(1200px 400px at 50% -10%, #fff 0%, transparent 70%),
        linear-gradient(180deg, #f4ede2 0%, var(--bg) 100%);
    }
    .hero .en { font-family: 'Cormorant Garamond', serif; letter-spacing: 0.3em; color: var(--accent); text-transform: uppercase; font-size: 0.85rem; }
    .hero h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 14px 0 18px; letter-spacing: 0.04em; }
    .hero p { color: var(--muted); font-size: 1rem; }
    .hero .cta {
      display: inline-block; margin-top: 30px; padding: 13px 34px;
      background: var(--ink); color: #fff; border-radius: 999px; font-size: 0.9rem;
      transition: background .2s, transform .15s;
    }
    .hero .cta:hover { background: var(--accent-dark); transform: translateY(-2px); }

    /* ===== Categories ===== */
    .filters {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      margin: 44px 0 34px;
    }
    .chip {
      padding: 8px 20px; border-radius: 999px; font-size: 0.85rem;
      background: var(--card); border: 1px solid var(--line); color: var(--muted);
      transition: all .18s ease;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent-dark); }
    .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

    /* ===== Product grid ===== */
    .grid {
      display: grid; gap: 26px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      padding-bottom: 70px;
    }
    .card {
      background: var(--card); border-radius: 16px; overflow: hidden;
      box-shadow: var(--shadow); transition: transform .2s ease, box-shadow .2s ease;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(120,100,80,.16); }
    .thumb {
      aspect-ratio: 1 / 1; position: relative; cursor: pointer;
      display: grid; place-items: center;
    }
    .thumb .ph {
      font-family: 'Cormorant Garamond', serif; color: rgba(255,255,255,.85);
      font-size: 2.6rem; letter-spacing: 0.05em; user-select: none;
    }
    .badges { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; }
    .badge { padding: 3px 10px; border-radius: 999px; font-size: 0.68rem; background: rgba(255,255,255,.92); color: var(--accent-dark); font-weight: 500; }
    .badge.free { background: var(--accent); color: #fff; }
    .soldout {
      position: absolute; inset: 0; background: rgba(58,55,51,.55);
      display: grid; place-items: center; color: #fff; letter-spacing: 0.15em; font-size: 0.9rem;
    }
    .card .info { padding: 14px 16px 18px; display: flex; flex-direction: column; flex: 1; }
    .card .name { font-size: 0.92rem; font-weight: 400; line-height: 1.5; min-height: 2.9em; }
    .card .price-row { margin-top: auto; padding-top: 12px; display: flex; align-items: baseline; justify-content: space-between; }
    .price { font-size: 1.25rem; color: var(--price); font-weight: 500; }
    .price small { font-size: 0.72rem; color: var(--muted); font-weight: 300; }
    .add {
      padding: 8px 14px; border-radius: 10px; background: #f1ebe0; color: var(--accent-dark);
      font-size: 0.8rem; font-weight: 500; transition: background .18s;
    }
    .add:hover { background: var(--accent); color: #fff; }
    .add:disabled { background: #eee; color: #bbb; cursor: not-allowed; }

    /* ===== Modal (product detail) ===== */
    .overlay {
      position: fixed; inset: 0; background: rgba(40,35,30,.5); backdrop-filter: blur(3px);
      display: none; z-index: 100; opacity: 0; transition: opacity .2s;
    }
    .overlay.open { display: block; opacity: 1; }
    .modal {
      position: fixed; z-index: 101; top: 50%; left: 50%; transform: translate(-50%, -46%);
      width: min(720px, 92vw); max-height: 88vh; overflow-y: auto;
      background: var(--card); border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.3);
      opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s;
    }
    .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
    .modal .m-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .modal .m-img { aspect-ratio: 1/1; display: grid; place-items: center; }
    .modal .m-img .ph { font-family: 'Cormorant Garamond', serif; color: rgba(255,255,255,.85); font-size: 3.4rem; }
    .modal .m-body { padding: 30px 28px; }
    .modal .m-cat { font-size: 0.75rem; color: var(--accent); letter-spacing: 0.08em; }
    .modal .m-name { font-size: 1.3rem; margin: 8px 0 14px; font-weight: 500; }
    .modal .m-desc { font-size: 0.9rem; color: #6a645b; margin-bottom: 20px; }
    .modal .m-price { font-size: 1.7rem; color: var(--price); font-weight: 500; margin-bottom: 20px; }
    .modal .m-price small { font-size: 0.8rem; color: var(--muted); }
    .modal .m-add {
      width: 100%; padding: 14px; border-radius: 12px; background: var(--ink); color: #fff;
      font-size: 0.95rem; font-weight: 500; transition: background .2s;
    }
    .modal .m-add:hover { background: var(--accent-dark); }
    .close-x {
      position: absolute; top: 14px; right: 16px; width: 34px; height: 34px;
      border-radius: 50%; background: rgba(255,255,255,.85); font-size: 1.2rem; color: var(--ink);
      display: grid; place-items: center; z-index: 2;
    }

    /* ===== Cart drawer ===== */
    .drawer {
      position: fixed; top: 0; right: 0; z-index: 110; height: 100%; width: min(400px, 90vw);
      background: var(--bg); box-shadow: -10px 0 40px rgba(0,0,0,.2);
      transform: translateX(100%); transition: transform .28s ease;
      display: flex; flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer h3 { padding: 22px 22px 16px; font-size: 1.15rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .drawer .items { flex: 1; overflow-y: auto; padding: 8px 16px; }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 0.9rem; }
    .citem { display: flex; gap: 12px; padding: 14px 6px; border-bottom: 1px solid var(--line); }
    .citem .ci-img { width: 60px; height: 60px; border-radius: 10px; flex-shrink: 0; display:grid; place-items:center; }
    .citem .ci-img span { font-family:'Cormorant Garamond',serif; color:#fff; font-size:1.3rem; }
    .citem .ci-main { flex: 1; min-width: 0; }
    .citem .ci-name { font-size: 0.82rem; line-height: 1.4; }
    .citem .ci-price { font-size: 0.9rem; color: var(--price); margin-top: 4px; }
    .qty { display: inline-flex; align-items: center; gap: 10px; margin-top: 6px; }
    .qty button { width: 24px; height: 24px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); font-size: 1rem; line-height: 1; color: var(--ink); }
    .qty span { font-size: 0.85rem; min-width: 18px; text-align: center; }
    .ci-remove { font-size: 0.72rem; color: var(--muted); margin-top: 4px; text-align: right; }
    .ci-remove:hover { color: var(--sale); }
    .drawer .foot { border-top: 1px solid var(--line); padding: 20px 22px; background: var(--card); }
    .total-row { display: flex; justify-content: space-between; font-size: 1.05rem; margin-bottom: 4px; }
    .total-row b { color: var(--price); font-size: 1.3rem; }
    .foot .note { font-size: 0.72rem; color: var(--muted); margin-bottom: 14px; }
    .checkout { width: 100%; padding: 14px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 0.95rem; font-weight: 500; transition: background .2s; }
    .checkout:hover { background: var(--accent-dark); }
    .checkout:disabled { background: #ddd; cursor: not-allowed; }

    /* ===== Footer / notice ===== */
    .notice { background: #f4ede2; border-radius: 14px; padding: 20px 24px; margin: 0 0 60px; font-size: 0.82rem; color: #7a6f5f; }
    .notice b { color: var(--accent-dark); }
    footer { border-top: 1px solid var(--line); padding: 40px 0; text-align: center; color: var(--muted); font-size: 0.82rem; }
    footer .logo { font-size: 1.2rem; margin-bottom: 8px; color: var(--ink); }

    .toast {
      position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: #fff; padding: 12px 24px; border-radius: 999px; font-size: 0.85rem;
      opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 560px) {
      .modal .m-grid { grid-template-columns: 1fr; }
      .modal .m-img { aspect-ratio: 16/10; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container nav">
      <a href="#" class="logo">work<span>endo</span></a>
      <button class="cart-btn" id="openCart">
        <span>🛒 カート</span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <p class="en" id="tagEn">Little things for a better everyday</p>
      <h1 id="shopTagline">毎日をちょっと素敵にする、暮らしの雑貨店</h1>
      <p>厳選したアイテムを、あなたのもとへ直送でお届けします。</p>
      <a href="#shop" class="cta">商品を見る</a>
    </div>
  </section>

  <main class="container" id="shop">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <div class="notice" id="notice"></div>
  </main>

  <footer>
    <div class="container">
      <div class="logo">work<span style="color:var(--accent)">endo</span></div>
      <p>© 2026 workendo. All rights reserved.</p>
      <p style="margin-top:6px; font-size:0.75rem;">特定商取引法に基づく表記 / プライバシーポリシー / お問い合わせ</p>
    </div>
  </footer>

  <!-- Product modal -->
  <div class="overlay" id="overlay"></div>
  <div class="modal" id="modal"></div>

  <!-- Cart drawer -->
  <aside class="drawer" id="drawer">
    <h3>カート <button class="close-x" style="position:static" id="closeCart">×</button></h3>
    <div class="items" id="cartItems"></div>
    <div class="foot">
      <div class="total-row"><span>合計</span><b id="cartTotal">¥0</b></div>
      <p class="note">※ 送料・決済は導入するサービスに応じて別途設定します</p>
      <button class="checkout" id="checkout" disabled>レジに進む</button>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>
    const yen = n => '¥' + n.toLocaleString('ja-JP');
    const grad = colors => `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
    let DATA = null;
    let activeCat = 'all';
    const CART_KEY = 'workendo_cart';
    let cart = JSON.parse(localStorage.getItem(CART_KEY) || '{}');

    const $ = s => document.querySelector(s);

    async function boot() {
      try {
        const res = await fetch('products.json');
        if (!res.ok) throw new Error('load fail');
        DATA = await res.json();
      } catch (e) {
        $('#grid').innerHTML = '<p style="color:var(--muted)">商品データ (products.json) を読み込めませんでした。ローカルで開く場合は簡易サーバー経由でご覧ください（例: <code>python3 -m http.server</code>）。</p>';
        return;
      }
      $('#shopTagline').textContent = DATA.shop.tagline;
      $('#tagEn').textContent = DATA.shop.tagline_en;
      $('#notice').innerHTML = '<b>お知らせ:</b> ' + DATA.shop.notice;
      renderFilters();
      renderGrid();
      renderCart();
      wire();
    }

    function renderFilters() {
      $('#filters').innerHTML = DATA.categories.map(c =>
        `<button class="chip ${c.id === activeCat ? 'active' : ''}" data-cat="${c.id}">${c.name}</button>`
      ).join('');
    }

    function productById(id) { return DATA.products.find(p => p.id === id); }

    function renderGrid() {
      const list = DATA.products.filter(p => activeCat === 'all' || p.category === activeCat);
      $('#grid').innerHTML = list.map(p => {
        const badges = (p.tags || []).map(t =>
          `<span class="badge ${t === '送料無料' ? 'free' : ''}">${t}</span>`).join('');
        return `
        <div class="card">
          <div class="thumb" data-open="${p.id}" style="background:${grad(p.color)}">
            <span class="ph">${p.name.charAt(0)}</span>
            <div class="badges">${badges}</div>
            ${!p.stock ? '<div class="soldout">SOLD OUT</div>' : ''}
          </div>
          <div class="info">
            <p class="name">${p.name}</p>
            <div class="price-row">
              <span class="price">${yen(p.price)}<small> 税込</small></span>
              <button class="add" data-add="${p.id}" ${!p.stock ? 'disabled' : ''}>${p.stock ? 'カートに追加' : '欠品中'}</button>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    function openModal(id) {
      const p = productById(id);
      const catName = (DATA.categories.find(c => c.id === p.category) || {}).name || '';
      $('#modal').innerHTML = `
        <button class="close-x" id="closeModal">×</button>
        <div class="m-grid">
          <div class="m-img" style="background:${grad(p.color)}"><span class="ph">${p.name.charAt(0)}</span></div>
          <div class="m-body">
            <p class="m-cat">${catName}</p>
            <h2 class="m-name">${p.name}</h2>
            <p class="m-desc">${p.description}</p>
            <p class="m-price">${yen(p.price)} <small>税込</small></p>
            <button class="m-add" data-add="${p.id}" ${!p.stock ? 'disabled' : ''}>${p.stock ? 'カートに追加する' : '現在欠品中です'}</button>
          </div>
        </div>`;
      $('#overlay').classList.add('open');
      $('#modal').classList.add('open');
      $('#closeModal').onclick = closeModal;
    }
    function closeModal() {
      $('#overlay').classList.remove('open');
      $('#modal').classList.remove('open');
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      save();
      renderCart();
      showToast('カートに追加しました');
    }
    function setQty(id, q) {
      if (q <= 0) delete cart[id]; else cart[id] = q;
      save(); renderCart();
    }
    function save() { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }

    function renderCart() {
      const ids = Object.keys(cart);
      const count = ids.reduce((s, id) => s + cart[id], 0);
      $('#cartCount').textContent = count;
      let total = 0;
      if (ids.length === 0) {
        $('#cartItems').innerHTML = '<div class="empty">カートは空です。<br>気になる商品を追加してみましょう。</div>';
      } else {
        $('#cartItems').innerHTML = ids.map(id => {
          const p = productById(id); if (!p) return '';
          const q = cart[id]; total += p.price * q;
          return `
          <div class="citem">
            <div class="ci-img" style="background:${grad(p.color)}"><span>${p.name.charAt(0)}</span></div>
            <div class="ci-main">
              <p class="ci-name">${p.name}</p>
              <p class="ci-price">${yen(p.price)}</p>
              <div class="qty">
                <button data-q="${id}:${q-1}">−</button>
                <span>${q}</span>
                <button data-q="${id}:${q+1}">＋</button>
              </div>
            </div>
            <button class="ci-remove" data-q="${id}:0">削除</button>
          </div>`;
        }).join('');
      }
      $('#cartTotal').textContent = yen(total);
      $('#checkout').disabled = ids.length === 0;
    }

    let toastTimer;
    function showToast(msg) {
      const t = $('#toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function wire() {
      document.body.addEventListener('click', e => {
        const open = e.target.closest('[data-open]');
        const add = e.target.closest('[data-add]');
        const chip = e.target.closest('[data-cat]');
        const q = e.target.closest('[data-q]');
        if (open) openModal(open.dataset.open);
        if (add) addToCart(add.dataset.add);
        if (chip) { activeCat = chip.dataset.cat; renderFilters(); renderGrid(); }
        if (q) { const [id, val] = q.dataset.q.split(':'); setQty(id, parseInt(val)); }
      });
      $('#openCart').onclick = () => $('#drawer').classList.add('open');
      $('#closeCart').onclick = () => $('#drawer').classList.remove('open');
      $('#overlay').onclick = closeModal;
      $('#checkout').onclick = () => showToast('決済サービスを接続するとここで購入完了できます');
      document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#drawer').classList.remove('open'); } });
    }

    boot();
  </script>
</body>
</html>
